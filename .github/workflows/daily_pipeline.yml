name: HKG-Japan Flight ELT Pipeline

on:
  schedule:
    # UTC 01:00 = 香港時間 (HKT) 每天早上 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-elt-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Extract & Load to Data Lake
        run: python src/1_extract_to_lake.py

      - name: 5. Transform & Load to Data Warehouse
        run: python src/2_lake_to_warehouse.py

      - name: 6. Commit & Push Data Updates
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "data: update lake and warehouse ($(date +'%Y-%m-%d'))" && git push)
