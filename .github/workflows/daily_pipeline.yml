name: HKG-Japan Flight ELT Pipeline

on:
  schedule:
    # GitHub Actions 使用 UTC 時間。香港時間 (HKT) 為 UTC+8
    # 設定為 UTC 01:17 = 香港時間每天早上 09:17 (避開整點排程塞車)
    - cron: '17 1 * * *'
  workflow_dispatch: # 允許在 GitHub 網頁手動點擊「Run workflow」立即測試

permissions:
  contents: write # 開啟寫入權限，讓機器人能將 Data Lake 與 Data Warehouse 推回 Repo

jobs:
  run-elt-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 下載儲存庫程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安裝 Python 套件與 Playwright Chromium 瀏覽器
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 4. Extract & Load to Data Lake (擷取去回程原始快照)
        run: python src/1_extract_to_lake.py

      - name: 5. Transform & Load to Data Warehouse (配對最佳航班並重建資料庫)
        run: python src/2_lake_to_warehouse.py

      - name: 6. 自動提交並推送更新後的數據檔案
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          # 僅在 data/ 資料夾有實際變動時才執行 commit，避免無變動報錯
          git diff --quiet && git diff --staged --quiet || (git commit -m "data: update lake and warehouse ($(date +'%Y-%m-%d'))" && git push)
